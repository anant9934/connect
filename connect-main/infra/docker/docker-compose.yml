version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: connect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: connect_app
      POSTGRES_PASSWORD: connect_dev_password
      POSTGRES_DB: connect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect_app -d connect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: connect_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
