# ==============================================================================
# LiveKit SFU Configuration Boundary (Phase 2 Realtime Preparation)
# ==============================================================================
# Media plane is logically isolated from the Go application backend.
# The Go API issues short-lived JWT grants; LiveKit handles WebRTC SFU streaming.
# ==============================================================================

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  # Enable modern codecs: Opus audio with simulcast/SVC support
  enable_loopback_candidate: false

keys:
  devkey: devsecret

logging:
  level: info
  pion_level: warn

turn:
  enabled: false # External enterprise TURN/STUN cluster configured in Phase 2
  domain: ""
  cert_file: ""
  key_file: ""

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50
