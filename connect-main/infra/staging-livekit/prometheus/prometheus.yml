# ==============================================================================
# TATHASTU CONNECT — PROMETHEUS CONFIGURATION FOR LIVEKIT STAGING
# Scrapes LiveKit Metrics (Port 6789) and Host Resource Metrics (Port 9100)
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # ----------------------------------------------------------------------------
  # LiveKit SFU Telemetry (Port 6789)
  # Tracks: active rooms, participant count, packet loss, bandwidth in/out,
  # TWCC estimations, NACKs, PLIs, keyframe requests, and ICE disconnects
  # ----------------------------------------------------------------------------
  - job_name: 'livekit-sfu'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:6789']
        labels:
          environment: 'staging'
          region: 'mumbai'
          datacenter: 'in-bom'
          node_role: 'sfu-media'

  # ----------------------------------------------------------------------------
  # Node Exporter Telemetry (Port 9100)
  # Tracks: CPU utilization, RAM usage, network interface PPS, socket buffer drops,
  # disk I/O, and context switches
  # ----------------------------------------------------------------------------
  - job_name: 'host-system'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          environment: 'staging'
          region: 'mumbai'
          node_role: 'host-system'
