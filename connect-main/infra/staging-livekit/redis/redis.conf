# ==============================================================================
# TATHASTU CONNECT — MUMBAI LOCAL REDIS COORDINATOR
# Dedicated Instance / Private VLAN Topology
# ==============================================================================

# Network Binding: Bind strictly to loopback and Linode Private VLAN IP
# NEVER bind to 0.0.0.0 or expose to public internet
bind 127.0.0.1 192.168.10.5
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Authentication (Must match STAGING_REDIS_PASSWORD in .env)
requirepass ChangeMeInStagingWithGenerated64CharSecret

# Memory Management
maxmemory 3221225472 # 3 GB cap on 4GB VM
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence & Durability (AOF everysec ensures sub-1s data loss window)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots as backup tier
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb
dir /data

# Security: Disable or rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN "MUMBAI_ADMIN_SHUTDOWN_CMD"

# Slowlog Monitoring (Alert if any query takes > 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 1024
