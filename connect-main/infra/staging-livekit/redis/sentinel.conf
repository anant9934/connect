# ==============================================================================
# TATHASTU CONNECT — MUMBAI REDIS SENTINEL HA CONFIGURATION
# High-Availability Automated Master Failover
# ==============================================================================

port 26379
bind 127.0.0.1 192.168.10.5
protected-mode yes

# Monitor the primary Mumbai Redis master
# Quorum = 2 (Requires 2 sentinels to agree before triggering master failover)
sentinel monitor livekit-mumbai-master 192.168.10.5 6379 2

# Master authentication
sentinel auth-pass livekit-mumbai-master ChangeMeInStagingWithGenerated64CharSecret

# Failure Detection Thresholds
# If master is unreachable for 3,000ms (3s), mark as Subjectively Down (sdown)
sentinel down-after-milliseconds livekit-mumbai-master 3000

# Failover Timeout: 10,000ms (10s)
sentinel failover-timeout livekit-mumbai-master 10000

# Parallel sync count during failover
sentinel parallel-syncs livekit-mumbai-master 1

# Notification scripts (Optional webhook for alerting on failover)
# sentinel notification-script livekit-mumbai-master /var/scripts/notify-failover.sh
