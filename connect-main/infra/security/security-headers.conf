# ==============================================================================
# Edge / Reverse Proxy Security Headers Reference Policy
# Aligns with Go API and Next.js middleware security header implementations
# ==============================================================================

# Content-Security-Policy (Restricted, hardened against XSS and clickjacking)
# default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
# img-src 'self' data: blob:; connect-src 'self' wss: https:;
# font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none';

# Anti-MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# Strict Transport Security (HSTS) - Enabled only on HTTPS
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Frame Ancestors / Clickjacking Defense
add_header X-Frame-Options "DENY" always;

# Permissions Policy (Restrict camera/mic on non-meeting landing pages)
add_header Permissions-Policy "camera=(), microphone=(), display-capture=(), geolocation=(), payment=()" always;

# Cross-Origin Policies
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
