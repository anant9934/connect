name: Quality Gate

on:
  push:
    branches:
      - main
      - 'remediation/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'remediation/**'

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code & Security Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Conflict Markers
        run: |
          echo "Checking for unresolved merge conflict markers..."
          if git grep -E '^(<<<<<<< .+|=======(\r)?$|>>>>>>> .+)' -- ':!*.md' ':!docs/*' ':!config/*'; then
            echo "::error::Merge conflict markers detected in codebase!"
            exit 1
          fi
          echo "No conflict markers detected."

      - name: Verify No Sensitive / Credential Files
        run: |
          echo "Checking for sensitive files..."
          BLOCKED=$(git ls-files | grep -E '(\.env$|\.env\.(local|production|development|staging|test)|\.pem$|\.key$|id_rsa|credentials\.json)' || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::Sensitive files committed to repository: $BLOCKED"
            exit 1
          fi
          echo "No sensitive files detected."

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Atomic Health Check
        run: |
          chmod +x scripts/git/health-check.sh
          ./scripts/git/health-check.sh --working-tree --skip-tests

      - name: Setup Go
        if: hashFiles('connect-main/services/api/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: connect-main/services/api/go.sum

      - name: Run Go Backend Tests
        if: hashFiles('connect-main/services/api/go.mod') != ''
        run: |
          cd connect-main/services/api
          go test -v -race ./...

      - name: Setup Node.js
        if: hashFiles('connect-main/apps/web/package.json', 'connect-main/apps/mobile/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Web And Mobile Tests, Typecheck And Build
        if: hashFiles('connect-main/package-lock.json') != ''
        run: |
          cd connect-main
          npm ci
          npm run typecheck:web
          npm run typecheck:mobile
          npm run test:web
          npm test --workspace=apps/mobile
          npm run build:web

      - name: Validate SQL Migrations Syntax
        run: |
          echo "Verifying PostgreSQL migration files integrity..."
          for f in connect-main/migrations/*.sql; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            if [ ! -s "$f" ]; then
              echo "::error::Empty migration file found: $f"
              exit 1
            fi
          done
          echo "All migration files verified."

  postgres-16-integration:
    name: PostgreSQL 16 Integration & Security Harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connect_admin
          POSTGRES_PASSWORD: connect_disposable_ci_password_456
          POSTGRES_DB: connect_test_ci_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute PostgreSQL 16 Migration & Security Test Harness
        env:
          CONFIRM_DISPOSABLE_DB: "true"
          TEST_DATABASE_URL: "postgres://connect_admin:connect_disposable_ci_password_456@localhost:5432/connect_test_ci_runner?sslmode=disable"
        run: |
          chmod +x scripts/test_pg16_migrations.sh
          ./scripts/test_pg16_migrations.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: connect-main/services/api/go.sum

      - name: Run Go Database Integration Tests on PostgreSQL 16
        env:
          REQUIRE_TEST_DATABASE: "true"
          TEST_DATABASE_URL: "postgres://connect_admin:connect_disposable_ci_password_456@localhost:5432/connect_test_ci_runner?sslmode=disable"
        run: |
          cd connect-main/services/api
          go test -v -race -run 'TestPostgres_.*' ./internal/room/...

      - name: Verify Migration 000010 Rollback And Reapply
        env:
          ADMIN_URL: "postgres://connect_admin:connect_disposable_ci_password_456@localhost:5432/connect_test_ci_runner?sslmode=disable"
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000036.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000035.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000034.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000033.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000029.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000028.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000027.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000026.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000025.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000024.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000023.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000022.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000021.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000020.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000019.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000018.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000017.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000016.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000015.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000014.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000013.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000012.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000011.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f tests/sql/rollback_000010.sql
          psql "$ADMIN_URL" -tAc "SELECT to_regclass('participant_media_sessions') IS NULL" | grep -qx t
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000010_trusted_sessions_and_attendance_policies.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000011_service_role_access.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000012_fix_allocation_policy_recursion.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000013_room_participant_access.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000014_room_guest_context.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000015_room_rls_and_entry_rules.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000016_auth_and_audit_rls.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000017_scheduled_meetings_and_passcodes.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000018_cohost_and_host_transfer.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000019_institution_management.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000020_meeting_interaction.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000021_polls_quizzes_doubts.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000022_notifications.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000023_meeting_search.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000024_admin_dashboard.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000025_attendance_signals.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000026_calendar_export.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000027_classroom_boards.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000028_breakout_rooms.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000029_fail_closed_checks.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000033_live_generated_canvas.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000034_meeting_numbers.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000035_password_reset_and_member_login.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f connect-main/migrations/000036_board_text_shapes_notes.sql

      - name: Verify RLS Under Restricted Runtime Roles
        env:
          ADMIN_URL: "postgres://connect_admin:connect_disposable_ci_password_456@localhost:5432/connect_test_ci_runner?sslmode=disable"
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -c "ALTER ROLE connect_app PASSWORD 'disposable'; ALTER ROLE connect_worker PASSWORD 'disposable';"
          cd connect-main/services/api
          status=0
          for role in connect_app connect_worker; do
            echo "::group::RLS as $role"
            TEST_DATABASE_URL="$ADMIN_URL" \
            TEST_APP_DATABASE_URL="postgres://$role:disposable@localhost:5432/connect_test_ci_runner?sslmode=disable" \
              go test -count=1 -v -run 'TestRLS_' $([ "$role" = connect_worker ] && echo ./internal/worker) ./internal/attendance > "/tmp/rls_$role.txt" 2>&1 || status=1
            cat "/tmp/rls_$role.txt"
            grep -E -- '--- (PASS|FAIL|SKIP)|role under test|_test\.go:[0-9]+:' "/tmp/rls_$role.txt" | while IFS= read -r line; do
              echo "::notice title=RLS $role::$line"
            done
            echo "::endgroup::"
          done
          exit $status

      - name: Verify Class Session Attendance Workflow
        env:
          TEST_DATABASE_URL: "postgres://connect_admin:connect_disposable_ci_password_456@localhost:5432/connect_test_ci_runner?sslmode=disable"
          TEST_CONNECT_APP_URL: "postgres://connect_app:disposable@localhost:5432/connect_test_ci_runner?sslmode=disable"
          TEST_CONNECT_WORKER_URL: "postgres://connect_worker:disposable@localhost:5432/connect_test_ci_runner?sslmode=disable"
        run: |
          cd connect-main/services/api
          status=0
          go test -p 1 -count=1 -v -run 'TestWorkflowDB_' ./internal/... ./cmd/... > /tmp/wf.txt 2>&1 || status=1
          cat /tmp/wf.txt
          # GitHub keeps only 10 annotations per step, so failures go first.
          { grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic:' /tmp/wf.txt || true; grep -E -- '^--- SKIP' /tmp/wf.txt || true; echo "totals: $(grep -cE -- '^--- PASS' /tmp/wf.txt) passed, $(grep -cE -- '^--- FAIL' /tmp/wf.txt) failed, $(grep -cE -- '^--- SKIP' /tmp/wf.txt) skipped"; grep -E -- '--- PASS: TestWorkflowDB_(APIAndWorker|ProcessStartup|RuntimeIdentity)' /tmp/wf.txt | grep -v '/' || true; grep -E -- '--- PASS: TestWorkflowDB_ProcessStartup[^ ]*/' /tmp/wf.txt || true; } | head -10 | while IFS= read -r line; do
            echo "::notice title=RLS workflow::$line"
          done
          exit $status

      - name: Verify Worker Provisioning Script
        run: bash scripts/test_provision_render_worker.sh

      - name: Setup Node For Browser Test
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Web Journeys In A Real Browser
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: "postgres://connect_app:disposable@localhost:5432/connect_test_ci_runner?sslmode=disable"
          APP_ENV: development
          PORT: "8080"
          RATE_LIMIT_ENABLED: "false"
          WORKER_ENABLED: "true"
          WORKER_DATABASE_URL: "postgres://connect_worker:disposable@localhost:5432/connect_test_ci_runner?sslmode=disable"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          PUBLIC_APP_ORIGIN: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:8080"
          LIVEKIT_API_KEY: "disposablekey"
          LIVEKIT_API_SECRET: "disposable_livekit_secret_for_browser_tests"
          LIVEKIT_URL: "ws://localhost:7880"
          WEB_URL: "http://localhost:3000"
          API_URL: "http://localhost:8080"
          ADMIN_DATABASE_URL: "postgres://connect_admin:connect_disposable_ci_password_456@localhost:5432/connect_test_ci_runner?sslmode=disable"
        run: |
          (cd connect-main/services/api && go build -o /tmp/connect-api ./cmd/server)
          /tmp/connect-api > /tmp/api.log 2>&1 &
          cd connect-main/apps/web
          npm ci --no-audit --no-fund > /tmp/npm.log 2>&1
          npm run build > /tmp/next-build.log 2>&1 || { tail -30 /tmp/next-build.log; exit 1; }
          npx next start -p 3000 > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/health/live >/dev/null && curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(which google-chrome)"
          status=0
          mkdir -p /tmp/journeys
          journey() {
            node "test/$2" > "/tmp/journeys/$1.txt" 2>&1 || status=1
            cat "/tmp/journeys/$1.txt" >> /tmp/e2e.txt
          }
          # A local media server. This proves our integration, not the LiveKit Cloud account.
          start_livekit() {
            docker rm -f livekit > /dev/null 2>&1 || true
            docker run -d --name livekit --network host -e LIVEKIT_CONFIG="$(printf 'port: 7880\nlogging:\n  level: info\nrtc:\n  tcp_port: 7881\n  udp_port: 7882\n  use_external_ip: false\nkeys:\n  %s: %s\nwebhook:\n  api_key: %s\n  urls:\n    - http://localhost:8080/api/v1/livekit/webhook\n' "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" "$LIVEKIT_API_KEY")" "livekit/livekit-server:v1.13.11" --node-ip 127.0.0.1 > /dev/null
            sleep 3
          }
          : > /tmp/media_trace.txt
          # livekit-client 2.22 renegotiates forever against server v1.9.0, reconnecting every 15s.
          start_livekit
          two_pass=0; for i in 1 2 3; do
            MEDIA_TRACE_LABEL="two-$i" node test/e2e_media_stability.mjs >> /tmp/e2e.txt 2>&1 && two_pass=$((two_pass + 1)) || status=1
          done
          three_pass=0; for i in 1 2 3; do
            node test/e2e_meeting_interaction.mjs >> /tmp/e2e.txt 2>&1 && three_pass=$((three_pass + 1)) || status=1
          done
          echo "::notice title=RLS browser::repeat results: two-browser $two_pass/3 passed, three-browser $three_pass/3 passed"
          grep -E '^CHECK FAIL' /tmp/e2e.txt | sort | uniq -c | head -3 | cut -c1-220 | while IFS= read -r line; do
            echo "::notice title=RLS browser::$line"
          done
          { echo "==== server log ===="; docker logs livekit 2>&1 | grep -E 'negotiat|participant closing' | tail -6 | cut -c1-200; } >> /tmp/media_trace.txt
          echo "runner: $(nproc) cpus, load $(cut -d' ' -f1-3 /proc/loadavg)" >> /tmp/media_trace.txt
          journey schedule e2e_schedule_passcode.mjs
          # Signup allows 10 a minute from one address, so each journey starts a new window.
          sleep 61
          journey history e2e_history.mjs
          sleep 61
          journey admin e2e_admin.mjs
          sleep 61
          journey attendance e2e_attendance.mjs
          sleep 61
          journey board e2e_classroom_board.mjs
          journey breakouts e2e_breakouts.mjs
          sleep 61
          journey institution e2e_institution.mjs
          sleep 61
          journey account e2e_account_and_network.mjs
          journey lifecycle e2e_lifecycle.mjs
          sleep 61
          journey responsive e2e_responsive.mjs
          sleep 61
          journey acceptance e2e_acceptance.mjs
          cat /tmp/e2e.txt
          [ $status -eq 0 ] || tail -20 /tmp/api.log
          grep -E 'E2E FAIL' /tmp/e2e.txt | cut -c1-400 | head -6 | while IFS= read -r line; do
            echo "::notice title=RLS browser::$line"
          done
          echo "::notice title=RLS browser::passed: $(grep -E 'E2E PASS' /tmp/e2e.txt | sed 's/E2E PASS //' | sort | uniq -c | sed 's/^ *//' | tr '\n' ';' | cut -c1-600)"
          grep -E '^STEP' /tmp/e2e.txt | tail -1 | while IFS= read -r line; do
            echo "::notice title=RLS browser::last $line"
          done
          [ $status -eq 0 ] || docker logs livekit 2>&1 | grep -E 'participant closing' | tail -1 | grep -oE '"(reason|isExpectedToResume|clientInitiated)":[^,}]*' | tr '\n' ' ' | while IFS= read -r line; do
            echo "::notice title=RLS browser::livekit $line"
          done
          grep -E '"level":"ERROR"|panic' /tmp/api.log | tail -1 | cut -c1-200 | while IFS= read -r line; do
            echo "::notice title=RLS browser::api $line"
          done
          kill %1 %2 2>/dev/null || true
          exit $status

      - name: Report Browser Journeys
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, os, re
          passed, failed, missing = [], [], []
          expected = ['schedule', 'history', 'admin', 'attendance', 'board', 'breakouts', 'institution', 'account', 'lifecycle', 'responsive', 'acceptance']
          def escape(text):
              return text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          for name in expected:
              path = f'/tmp/journeys/{name}.txt'
              if not os.path.exists(path):
                  missing.append(name)
                  continue
              text = open(path, errors='replace').read()
              steps = re.findall(r'^STEP (.*)$', text, re.M)
              if re.search(r'^E2E PASS', text, re.M) and not re.search(r'^E2E FAIL', text, re.M):
                  passed.append(f'{name} ({len(steps)} steps)')
              else:
                  failed.append((name, steps, text))
          print(f"::notice title=Journey summary::passed {len(passed)}, failed {len(failed)}, did not run {len(missing)} of {len(expected)}. Passed: {'; '.join(passed)}. Did not run: {', '.join(missing)}")
          for name, steps, text in failed[:8]:
              detail = [line for line in text.splitlines() if re.match(r'E2E FAIL|PAGE |CONSOLE |page ', line)]
              body = 'steps passed before the failure: ' + ' > '.join(steps[:-1]) + '\n' + '\n'.join(detail) + '\n' + text[-800:] if not detail else 'steps passed before the failure: ' + ' > '.join(steps[:-1]) + '\n' + '\n'.join(detail)
              print(f"::notice title=Journey {name} FAILED::{escape(body[:3800])}")
          PY

      - name: Check Logs For Secrets
        if: ${{ !cancelled() }}
        run: |
          status=0
          for pattern in 'connect_disposable_ci_password_456' 'disposable_livekit_secret_for_browser_tests' 'correct-horse-battery-9' 'a-new-password-77' 'tc_session=' 'password_hash' 'argon2id'; do
            if cat /tmp/api.log /tmp/web.log /tmp/e2e.txt 2>/dev/null | grep -qF -- "$pattern"; then
              echo "::notice title=Secret scan::FOUND a sensitive value in logs: pattern $pattern"
              status=1
            fi
          done
          if [ $status -eq 0 ]; then echo "::notice title=Secret scan::no sensitive values in API, web or journey logs"; fi
          exit $status

      - name: Upload Browser Journey Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-reports
          path: |
            /tmp/journeys/
            /tmp/e2e.txt
            /tmp/api.log
            /tmp/web.log
          retention-days: 14
          if-no-files-found: warn

      - name: Report Media Trace
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os
          if os.path.exists('/tmp/media_trace.txt'):
              lines = open('/tmp/media_trace.txt').read().splitlines()
              keep = [l for l in lines if not any(n in l for n in ('DataReceived', 'added ICE', 'ice candidate', 'trickle'))]
              chunks, current = [], ''
              for line in keep:
                  if len(current) + len(line) > 3800:
                      chunks.append(current)
                      current = ''
                  current += line[:190] + '\n'
              chunks.append(current)
              # GitHub keeps 10 annotations per step, so show the end of the trace, in order.
              for i, chunk in enumerate(chunks[-10:]):
                  print(f'::notice title=RLS trace {i:02d}::' + chunk.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY
