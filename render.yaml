services:
  - type: web
    name: tathastu-connect-api
    runtime: docker
    dockerfilePath: ./connect-main/services/api/Dockerfile
    dockerContext: ./connect-main/services/api
    plan: starter
    region: singapore
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DB_MAX_OPEN_CONNS
        value: 25
      - key: DB_MAX_IDLE_CONNS
        value: 10
      - key: DB_CONN_MAX_LIFETIME_SEC
        value: 300
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_RPS
        value: 100
      - key: RATE_LIMIT_BURST
        value: 200
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: CLAMAV_ENABLED
        value: "false"
